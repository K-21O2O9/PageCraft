<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PageCraft - Advanced PDF Reader & Editor</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- PDF.js Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- Fabric.js Canvas Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <!-- PDF-Lib for Saving & Modifying PDFs -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <!-- Download helper -->
  <script src="https://unpkg.com/downloadjs@1.4.7/download.min.js"></script>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>

  <style>
    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    /* Canvas Layering Setup */
    .pdf-page-container {
      position: relative;
      margin: 0 auto 2rem auto;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      touch-action: pan-x pan-y pinch-zoom;
    }
    .pdf-canvas-layer {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }
    /* Enforce Fabric Container exact overlay alignment on top of PDF canvas */
    .canvas-container {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      z-index: 2 !important;
    }
    /* Allow scrolling through fabric canvas when view/scroll mode is active */
    .canvas-container.pointer-events-none-override {
      pointer-events: none !important;
    }
    .text-layer {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      opacity: 1;
      line-height: 1.0;
      z-index: 3;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .text-layer.active-select {
      pointer-events: auto !important;
      z-index: 10 !important;
      user-select: text !important;
      -webkit-user-select: text !important;
    }
    .text-layer span {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
    }
    .text-layer.active-select span {
      user-select: text !important;
      -webkit-user-select: text !important;
    }
    .text-layer.active-select ::selection {
      background: rgba(59, 130, 246, 0.45) !important;
      color: transparent !important;
    }

    /* Lock scroll when in active drawing / editing mode */
    .drawing-lock {
      overflow: hidden !important;
      touch-action: none !important;
    }
  </style>
</head>

<body class="h-full flex flex-col font-sans overflow-hidden select-none">

  <!-- Top Navigation / Header Toolbar -->
  <header class="h-16 bg-slate-800 border-b border-slate-700 flex items-center justify-between px-4 z-20 shrink-0">

    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-blue-600 flex items-center justify-center shadow-lg shadow-indigo-500/30">
        <i class="fa-solid fa-file-signature text-white text-xl"></i>
      </div>
      <div>
        <h1 class="text-lg font-bold tracking-wide bg-gradient-to-r from-white to-slate-300 bg-clip-text text-transparent">PageCraft</h1>
        <p class="text-xs text-slate-400 font-medium">PDF Reader & Studio</p>
      </div>
    </div>

    <!-- Quick Tools / Main Actions -->
    <div class="flex items-center space-x-2">
      <label for="pdf-upload" class="flex items-center space-x-2 px-3.5 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-semibold cursor-pointer transition">
        <i class="fa-solid fa-folder-open text-indigo-400"></i>
        <span class="hidden sm:inline">Open PDF</span>
        <input type="file" id="pdf-upload" accept="application/pdf" class="hidden">
      </label>

      <div class="h-6 w-px bg-slate-700 mx-1"></div>

      <!-- Undo & Redo -->
      <button id="btn-undo" title="Undo (Ctrl+Z)" class="p-2 rounded-lg bg-slate-700/60 hover:bg-slate-700 text-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
        <i class="fa-solid fa-rotate-left"></i>
      </button>
      <button id="btn-redo" title="Redo (Ctrl+Y)" class="p-2 rounded-lg bg-slate-700/60 hover:bg-slate-700 text-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition">
        <i class="fa-solid fa-rotate-right"></i>
      </button>

      <div class="h-6 w-px bg-slate-700 mx-1"></div>

      <!-- Zoom Controls -->
      <div class="flex items-center bg-slate-900/60 rounded-lg p-1 border border-slate-700">
        <button id="btn-zoom-out" title="Zoom Out" class="p-1.5 rounded text-slate-300 hover:bg-slate-700 transition">
          <i class="fa-solid fa-minus text-xs"></i>
        </button>
        <span id="zoom-percentage" class="px-2 text-xs font-mono font-bold text-indigo-300 min-w-[50px] text-center">102%</span>
        <button id="btn-zoom-in" title="Zoom In" class="p-1.5 rounded text-slate-300 hover:bg-slate-700 transition">
          <i class="fa-solid fa-plus text-xs"></i>
        </button>
      </div>

      <div class="h-6 w-px bg-slate-700 mx-1"></div>

      <!-- Save & Export -->
      <button id="btn-save-pdf" class="flex items-center space-x-2 px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shadow-md shadow-indigo-600/30 transition">
        <i class="fa-solid fa-download"></i>
        <span>Save PDF</span>
      </button>
    </div>
  </header>

  <!-- Secondary Interactive Toolbar & Editing Bar -->
  <div class="bg-slate-800/90 backdrop-blur border-b border-slate-700/80 px-4 py-2 flex flex-wrap items-center justify-between gap-3 z-10 shrink-0">
    <!-- Active Tool Selectors -->
    <div class="flex items-center space-x-1 bg-slate-900/80 p-1 rounded-xl border border-slate-700/60">
      <button data-tool="view" title="View, Pinch to Zoom & Scroll PDF" class="tool-btn active flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs font-medium transition">
        <i class="fa-solid fa-hand"></i>
        <span class="hidden md:inline">View</span>
      </button>

      <button data-tool="text-select" title="Select and Copy ANY PDF Text" class="tool-btn flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs font-medium transition text-slate-400 hover:text-slate-200">
        <i class="fa-solid fa-i-cursor"></i>
        <span class="hidden md:inline">Text Select</span>
      </button>

      <button data-tool="pen" title="Freehand Drawing Pen (Click again to toggle off & scroll)" class="tool-btn flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs font-medium transition text-slate-400 hover:text-slate-200">
        <i class="fa-solid fa-pen-nib"></i>
        <span class="hidden md:inline">Draw</span>
      </button>

      <button data-tool="eraser" title="Eraser Tool" class="tool-btn flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs font-medium transition text-slate-400 hover:text-slate-200">
        <i class="fa-solid fa-eraser"></i>

        <i class="fa-solid fa-font"></i>
        <span class="hidden md:inline">Text Box</span>

      <button data-tool="image" title="Insert Image" class="tool-btn flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs font-medium transition text-slate-400 hover:text-slate-200">
        <i class="fa-regular fa-image"></i>
        <span class="hidden md:inline">Image</span>
      </button>
      <input type="file" id="image-upload" accept="image/*" class="hidden">

      <button id="btn-watermark-modal" title="Add Watermark" class="tool-btn flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs font-medium transition text-slate-400 hover:text-slate-200">
        <i class="fa-solid fa-stamp"></i>
        <span class="hidden md:inline">Watermark</span>
      </button>

      <button id="btn-delete-selected" title="Delete Selected Object" class="px-2.5 py-1.5 rounded-lg text-xs font-medium text-rose-400 hover:bg-rose-500/20 transition hidden">
        <i class="fa-solid fa-trash-can"></i>
      </button>
    </div>

    <!-- Tool Property Controls -->
    <div class="flex items-center space-x-4 text-xs">
      <!-- Color Picker -->
      <div class="flex items-center space-x-2">
        <span class="text-slate-400 font-medium">Color:</span>
        <input type="color" id="prop-color" value="#ef4444" class="w-7 h-7 bg-transparent rounded cursor-pointer border-0">
      </div>

      <!-- Pen Thickness / Font Size / Eraser Size -->
      <div class="flex items-center space-x-2">
        <span class="text-slate-400 font-medium" id="prop-size-label">Size:</span>
        <input type="range" id="prop-size" min="1" max="60" value="4" class="w-24 accent-indigo-500 cursor-pointer">
        <span id="prop-size-val" class="w-6 text-slate-300 font-mono">4px</span>

      <!-- Opacity Slider -->
      <div class="flex items-center space-x-2">
        <span class="text-slate-400 font-medium">Opacity:</span>
        <input type="range" id="prop-opacity" min="0.1" max="1.0" step="0.05" value="1.0" class="w-20 accent-indigo-500 cursor-pointer">
        <span id="prop-opacity-val" class="w-8 text-slate-300 font-mono">100%</span>

    </div>

    <!-- Page Controls -->

      <button id="btn-next-page" class="p-1 text-slate-300 hover:text-white disabled:opacity-30 transition">
        <i class="fa-solid fa-chevron-right text-xs"></i>

  <!-- Main Viewport Container -->

    <!-- Empty State Placeholder -->
    <div id="drop-zone" class="my-auto flex flex-col items-center justify-center p-12 border-2 border-dashed border-slate-700 rounded-2xl bg-slate-900/50 hover:bg-slate-900/80 hover:border-indigo-500/50 transition cursor-pointer max-w-lg text-center shadow-2xl">
      <div class="w-16 h-16 rounded-full bg-indigo-500/10 text-indigo-400 flex items-center justify-center mb-4 text-3xl">
        <i class="fa-solid fa-cloud-arrow-up"></i>
      </div>
      <h3 class="text-lg font-bold text-white mb-1">Upload a PDF Document</h3>
      <p class="text-sm text-slate-400 mb-4">Drag and drop your file here, or click to browse standard PDF files.</p>
      <button class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs shadow-lg shadow-indigo-600/30 transition">
        Choose PDF File

  <style>
    .tool-btn.active {
      background-color: rgba(99, 102, 241, 0.25);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.4);

  <!-- Main Application Controller Script -->
  <script>
    /**
     * PageCraft Application State
     */
    const state = {
      pdfDoc: null,
      pdfBytes: null,
      pageNum: 1,
      pageCount: 0,
      scale: 1.02,          // Default zoom set to 102%
      activeTool: 'view',   // 'view', 'text-select', 'pen', 'eraser', 'textbox', 'image'
      fabricCanvases: [],   // Array of Fabric.js instances per page index
      history: [],          // Stores canvas state history for undo/redo
      historyIndex: -1,
      isApplyingHistory: false,
      isRendering: false    // Guard for render cycles
    };

    // Touch Pinch Tracking
    let initialPinchDist = null;
    let initialZoomScale = 1.02;

    // DOM Elements
    const dropZone = document.getElementById('drop-zone');
    const pdfUpload = document.getElementById('pdf-upload');
    const imageUpload = document.getElementById('image-upload');
    const renderWrapper = document.getElementById('pdf-render-wrapper');
    const viewportContainer = document.getElementById('viewport-container');
    const pageNumInput = document.getElementById('page-num-input');
    const pageCountEl = document.getElementById('page-count');
    const zoomVal = document.getElementById('zoom-percentage');
    
    // Tools & Props DOM
    const toolBtns = document.querySelectorAll('.tool-btn[data-tool]');
    const propColor = document.getElementById('prop-color');
    const propSize = document.getElementById('prop-size');
    const propSizeVal = document.getElementById('prop-size-val');
    const propOpacity = document.getElementById('prop-opacity');
    const propOpacityVal = document.getElementById('prop-opacity-val');
    const deleteBtn = document.getElementById('btn-delete-selected');

    // Init App Listeners
    window.addEventListener('DOMContentLoaded', () => {
      initEventListeners();
      setupDragAndDrop();
      setupPinchToZoom();
      updateToolUI();
    });

    /**
     * Setup Event Listeners
     */
    function initEventListeners() {
      // PDF File Uploads
      dropZone.addEventListener('click', () => pdfUpload.click());
      pdfUpload.addEventListener('change', handleFileSelect);

      // Scroll Observer for current active page tracking
      viewportContainer.addEventListener('scroll', updateActivePageOnScroll);

      // Page Navigation
      document.getElementById('btn-prev-page').addEventListener('click', () => changePage(-1));
      document.getElementById('btn-next-page').addEventListener('click', () => changePage(1));
      pageNumInput.addEventListener('change', (e) => {
        let num = parseInt(e.target.value);
        if (num >= 1 && num <= state.pageCount) {
          state.pageNum = num;
          scrollToPage(state.pageNum);
        } else {
          e.target.value = state.pageNum;
        }
      });

      // Zoom Controls
      document.getElementById('btn-zoom-in').addEventListener('click', () => setZoom(state.scale + 0.25));
      document.getElementById('btn-zoom-out').addEventListener('click', () => setZoom(state.scale - 0.25));

      // Tool Switches with toggle logic
      toolBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          if (state.isRendering) return;
          const tool = btn.getAttribute('data-tool');
          if (tool === 'image') {
            imageUpload.click();
          } else {
            // Toggle off if clicking the already active tool
            if (state.activeTool === tool && (tool === 'pen' || tool === 'eraser' || tool === 'textbox')) {
              setActiveTool('view');
            } else {
              setActiveTool(tool);
            }
          }
        });
      });

      imageUpload.addEventListener('change', handleImageInsert);

      // Property Controls
      propColor.addEventListener('input', updateActiveToolProperties);
      propSize.addEventListener('input', (e) => {
        propSizeVal.textContent = e.target.value + 'px';
        updateActiveToolProperties();
      });
      propOpacity.addEventListener('input', (e) => {
        propOpacityVal.textContent = Math.round(e.target.value * 100) + '%';
        updateActiveToolProperties();
      });

      deleteBtn.addEventListener('click', deleteSelectedObject);

      // Undo / Redo
      document.getElementById('btn-undo').addEventListener('click', undo);
      document.getElementById('btn-redo').addEventListener('click', redo);

      // Watermark Modal
      document.getElementById('btn-watermark-modal').addEventListener('click', () => {
        document.getElementById('watermark-modal').classList.remove('hidden');
      });
      document.getElementById('close-watermark-modal').addEventListener('click', () => {
        document.getElementById('watermark-modal').classList.add('hidden');
      });
      document.getElementById('btn-cancel-wm').addEventListener('click', () => {
        document.getElementById('watermark-modal').classList.add('hidden');
      });
      document.getElementById('btn-apply-wm').addEventListener('click', applyWatermark);

      // Save PDF Button
      document.getElementById('btn-save-pdf').addEventListener('click', saveExportPDF);

      // Keyboard Shortcuts
      window.addEventListener('keydown', (e) => {
        const isEditingText = state.fabricCanvases.some(fc => {
          const activeObj = fc.getActiveObject();
          return activeObj && activeObj.isEditing;
        });

        if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
          e.preventDefault();
          if (e.shiftKey) redo(); else undo();
        } else if ((e.ctrlKey || e.metaKey) && e.key === 'y') {
          e.preventDefault();
          redo();
        } else if ((e.key === 'Delete' || e.key === 'Backspace') && !isEditingText) {
          if (document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
            deleteSelectedObject();
          }
        }
      });
    }

    /**
     * Pinch-to-Zoom & Touch Handler for View Mode
     */
    function setupPinchToZoom() {
      viewportContainer.addEventListener('wheel', (e) => {
        if (e.ctrlKey || e.metaKey) {
          e.preventDefault();
          const delta = e.deltaY < 0 ? 0.15 : -0.15;
          setZoom(state.scale + delta);
        }
      }, { passive: false });

      viewportContainer.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2 && state.activeTool === 'view') {
          initialPinchDist = Math.hypot(
            e.touches[0].pageX - e.touches[1].pageX,
            e.touches[0].pageY - e.touches[1].pageY
          );
          initialZoomScale = state.scale;
        }
      });

      viewportContainer.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && initialPinchDist && state.activeTool === 'view') {
          e.preventDefault();
          const dist = Math.hypot(
            e.touches[0].pageX - e.touches[1].pageX,
            e.touches[0].pageY - e.touches[1].pageY
          );
          const factor = dist / initialPinchDist;
          const targetScale = Math.min(Math.max(0.5, initialZoomScale * factor), 4.0);
          setZoom(targetScale);
        }
      }, { passive: false });

      viewportContainer.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) {
          initialPinchDist = null;
        }
      });
    }

    /**
     * Drag & Drop File Loader
     */
    function setupDragAndDrop() {
      ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, preventDefaults, false);
      });
      function preventDefaults(e) { e.preventDefault(); e.stopPropagation(); }

      dropZone.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        const files = dt.files;
        if (files.length && files[0].type === 'application/pdf') {
          loadPDFFile(files[0]);
        }
      });
    }

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (file && file.type === 'application/pdf') {
        loadPDFFile(file);
      }
    }

    /**
     * Track active visible page while scrolling
     */
    function updateActivePageOnScroll() {
      if (!state.pageCount) return;
      const containerBounds = viewportContainer.getBoundingClientRect();
      const containerCenter = containerBounds.top + containerBounds.height / 3;

      for (let i = 1; i <= state.pageCount; i++) {
        const el = document.getElementById(`page-container-${i}`);
        if (el) {
          const rect = el.getBoundingClientRect();
          if (rect.top <= containerCenter && rect.bottom >= containerCenter) {
            if (state.pageNum !== i) {
              state.pageNum = i;
              pageNumInput.value = i;
            }
            break;
          }
        }
      }
    }

    /**
     * Load PDF Buffer and Render Pages
     */
    async function loadPDFFile(file) {
      const arrayBuffer = await file.arrayBuffer();
      state.pdfBytes = arrayBuffer.slice(0); // Copy for pdf-lib

      const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
      state.pdfDoc = await loadingTask.promise;
      state.pageCount = state.pdfDoc.numPages;
      state.pageNum = 1;

      pageCountEl.textContent = state.pageCount;
      pageNumInput.value = 1;

      dropZone.classList.add('hidden');
      renderWrapper.classList.remove('hidden');

      await renderAllPages();
      saveHistoryState();
    }

    /**
     * Safe Canvas Memory Calculation & HD Renderer
     */
    async function renderAllPages() {
      state.isRendering = true;
      
      // Clean up previous Fabric instances safely
      state.fabricCanvases.forEach(fc => {
        try {
          fc.clear();
          fc.dispose();
        } catch(e) {}
      });
      state.fabricCanvases = [];
      renderWrapper.innerHTML = '';

      // Safe DPR scaling
      const dpr = window.devicePixelRatio || 1;
      const outputScale = dpr > 1 ? Math.min(dpr, 1.5) : 1;

      for (let i = 1; i <= state.pageCount; i++) {
        const page = await state.pdfDoc.getPage(i);
        // We get base viewport (scale 1.0) for logical coordinates and scaled viewport for initial CSS styling
        const baseViewport = page.getViewport({ scale: 1.0 });
        const scaledViewport = page.getViewport({ scale: state.scale });

        // Page Container
        const pageContainer = document.createElement('div');
        pageContainer.className = 'pdf-page-container';
        pageContainer.id = `page-container-${i}`;
        pageContainer.style.width = `${scaledViewport.width}px`;
        pageContainer.style.height = `${scaledViewport.height}px`;

        // PDF Background Render Canvas
        const pdfCanvas = document.createElement('canvas');
        pdfCanvas.className = 'pdf-canvas-layer';
        pdfCanvas.width = Math.floor(scaledViewport.width * outputScale);
        pdfCanvas.height = Math.floor(scaledViewport.height * outputScale);
        pdfCanvas.style.width = `${scaledViewport.width}px`;
        pdfCanvas.style.height = `${scaledViewport.height}px`;
        
        const pdfCtx = pdfCanvas.getContext('2d');
        pdfCtx.imageSmoothingEnabled = true;
        pdfCtx.imageSmoothingQuality = 'high';

        // Fabric Canvas Element
        const fabricCanvasEl = document.createElement('canvas');
        fabricCanvasEl.id = `fabric-canvas-${i}`;

        // Text Selection Overlay Layer
        const textLayerDiv = document.createElement('div');
        textLayerDiv.className = `text-layer ${state.activeTool === 'text-select' ? 'active-select' : ''}`;
        // Set at base dimensions, then scale visually via CSS
        textLayerDiv.style.width = `${baseViewport.width}px`;
        textLayerDiv.style.height = `${baseViewport.height}px`;
        textLayerDiv.style.transform = `scale(${state.scale})`;
        textLayerDiv.style.transformOrigin = '0 0';

        pageContainer.appendChild(pdfCanvas);
        pageContainer.appendChild(fabricCanvasEl);
        pageContainer.appendChild(textLayerDiv);
        renderWrapper.appendChild(pageContainer);

        // Render PDF page
        const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;
        await page.render({ 
          canvasContext: pdfCtx, 
          viewport: scaledViewport,
          transform: transform 
        }).promise;

        // Render PDF Text Layer at Base Viewport Coordinates
        const textContent = await page.getTextContent();
        await pdfjsLib.renderTextLayer({
          textContentSource: textContent,
          container: textLayerDiv,
          viewport: baseViewport,
          textDivs: []
        }).promise;

        // Initialize Fabric.js Overlay Canvas AT BASE SCALE (Scale 1.0)
        const fCanvas = new fabric.Canvas(fabricCanvasEl.id, {
          width: baseViewport.width,
          height: baseViewport.height,
          selection: false,
          isDrawingMode: state.activeTool === 'pen',
          allowTouchScrolling: true,
          enableRetinaScaling: true
        });

        // Save base dimensions to scale up and down efficiently without re-rendering
        fCanvas.baseWidth = baseViewport.width;
        fCanvas.baseHeight = baseViewport.height;

        // Apply current Zoom properties
        fCanvas.setDimensions({ width: scaledViewport.width, height: scaledViewport.height });
        fCanvas.setZoom(state.scale);

        // Initialize Brush
        fCanvas.freeDrawingBrush = new fabric.PencilBrush(fCanvas);
        fCanvas.freeDrawingBrush.color = propColor.value;
        fCanvas.freeDrawingBrush.width = parseInt(propSize.value) || 4;

        // Track object events
        fCanvas.on('selection:created', onObjectSelected);
        fCanvas.on('selection:updated', onObjectSelected);
        fCanvas.on('selection:cleared', onObjectCleared);
        fCanvas.on('object:added', () => { 
          if (!state.isApplyingHistory && !state.isRendering) {
            saveHistoryState(); 
          }
        });
        fCanvas.on('object:modified', () => { 
          if (!state.isApplyingHistory && !state.isRendering) {
            saveHistoryState(); 
          }
        });
        fCanvas.on('object:removed', () => { 
          if (!state.isApplyingHistory && !state.isRendering) {
            saveHistoryState(); 
          }
        });

        state.fabricCanvases.push(fCanvas);
      }

      state.isRendering = false;
      updateToolUI();
      setActiveTool(state.activeTool);
    }

    /**
     * Active Tool Switcher & Scroll Lock Handler
     */
    function setActiveTool(tool) {
      state.activeTool = tool;

      // Lock viewport scrolling ONLY when actively using Pen, Textbox, or Eraser drawing mode
      if (tool === 'pen' || tool === 'textbox' || tool === 'eraser') {
        viewportContainer.classList.add('drawing-lock');
      } else {
        viewportContainer.classList.remove('drawing-lock');
      }

      // Update Tool Buttons UI
      toolBtns.forEach(btn => {
        if (btn.getAttribute('data-tool') === tool) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      // Update Property label depending on tool
      const sizeLabel = document.getElementById('prop-size-label');
      if (tool === 'textbox') {
        sizeLabel.textContent = 'Font:';
      } else if (tool === 'eraser') {
        sizeLabel.textContent = 'Eraser:';
      } else {
        sizeLabel.textContent = 'Size:';
      }

      // Update Native Text Layer pointer events
      document.querySelectorAll('.text-layer').forEach(layer => {
        if (tool === 'text-select') {
          layer.classList.add('active-select');
        } else {
          layer.classList.remove('active-select');
        }
      });

      // Update Fabric Canvases & pointer-events pass-through for scrolling
      state.fabricCanvases.forEach(fCanvas => {
        fCanvas.calcOffset();

        fCanvas.isDrawingMode = (tool === 'pen');
        fCanvas.selection = false; 
        fCanvas.allowTouchScrolling = true;

        const wrapperEl = fCanvas.upperCanvasEl ? fCanvas.upperCanvasEl.parentNode : null;
        if (wrapperEl) {
          if (tool === 'view' || tool === 'text-select') {
            wrapperEl.classList.add('pointer-events-none-override');
          } else {
            wrapperEl.classList.remove('pointer-events-none-override');
          }
        }

        if (tool === 'pen') {
          if (!fCanvas.freeDrawingBrush) {
            fCanvas.freeDrawingBrush = new fabric.PencilBrush(fCanvas);
          }
          fCanvas.freeDrawingBrush.color = propColor.value;
          fCanvas.freeDrawingBrush.width = parseInt(propSize.value) || 4;
          fCanvas.defaultCursor = 'crosshair';
        } else if (tool === 'eraser') {
          fCanvas.defaultCursor = 'cell';
        } else if (tool === 'textbox') {
          fCanvas.defaultCursor = 'text';
        } else if (tool === 'text-select') {
          fCanvas.defaultCursor = 'text';
        } else if (tool === 'view') {
          fCanvas.defaultCursor = 'grab';
        } else {
          fCanvas.defaultCursor = 'default';
        }

        // Remove previous listeners
        fCanvas.off('mouse:down');
        fCanvas.off('mouse:move');
        fCanvas.off('mouse:up');

        // Tool Mode Behaviors
        if (tool === 'textbox') {
          fCanvas.on('mouse:down', (options) => {
            if (state.activeTool === 'textbox') {
              if (options.target && (options.target.type === 'textbox' || options.target.type === 'i-text')) {
                options.target.enterEditing();
                return;
              }

              const pointer = fCanvas.getPointer(options.e);
              const fontBaseSize = Math.max(16, parseInt(propSize.value) * 3);
              const textbox = new fabric.Textbox('Type text here...', {
                left: pointer.x,
                top: pointer.y,
                width: 200,
                fontSize: fontBaseSize,
                fill: propColor.value,
                opacity: parseFloat(propOpacity.value),
                fontFamily: 'Helvetica, Arial, sans-serif',
                editable: true
              });

              fCanvas.add(textbox);
              fCanvas.setActiveObject(textbox);
              textbox.enterEditing();
              textbox.selectAll();
              fCanvas.renderAll();

              setActiveTool('view');
            }
          });
        } else if (tool === 'eraser') {
          let isErasing = false;

          fCanvas.on('mouse:down', (options) => {
            isErasing = true;
            if (options.target) {
              fCanvas.remove(options.target);
              fCanvas.renderAll();
            }
          });

          fCanvas.on('mouse:move', (options) => {
            if (isErasing && options.target) {
              fCanvas.remove(options.target);
              fCanvas.renderAll();
            }
          });

          fCanvas.on('mouse:up', () => {
            isErasing = false;
          });
        }
      });
    }

    /**
     * Update Properties of Brush or Active Selected Object
     */
    function updateActiveToolProperties() {
      const color = propColor.value;
      const size = parseInt(propSize.value) || 4;
      const opacity = parseFloat(propOpacity.value) || 1.0;

      state.fabricCanvases.forEach(fCanvas => {
        if (fCanvas.freeDrawingBrush) {
          fCanvas.freeDrawingBrush.color = color;
          fCanvas.freeDrawingBrush.width = size;
        }

        const activeObj = fCanvas.getActiveObject();
        if (activeObj) {
          if (activeObj.type === 'textbox' || activeObj.type === 'i-text') {
            activeObj.set({ fill: color, opacity: opacity, fontSize: Math.max(16, size * 3) });
          } else if (activeObj.type === 'path') {
            activeObj.set({ stroke: color, strokeWidth: size, opacity: opacity });
          } else {
            activeObj.set({ opacity: opacity });
          }
          fCanvas.renderAll();
        }
      });
    }

    function onObjectSelected(e) {
      deleteBtn.classList.remove('hidden');
      const obj = e.selected[0];
      if (obj) {
        if (obj.fill && typeof obj.fill === 'string') propColor.value = obj.fill;
        if (obj.opacity !== undefined) {
          propOpacity.value = obj.opacity;
          propOpacityVal.textContent = Math.round(obj.opacity * 100) + '%';
        }
      }
    }

    function onObjectCleared() {
      deleteBtn.classList.add('hidden');
    }

    function deleteSelectedObject() {
      state.fabricCanvases.forEach(fCanvas => {
        const activeObj = fCanvas.getActiveObject();
        if (activeObj) {
          fCanvas.remove(activeObj);
          fCanvas.discardActiveObject();
          fCanvas.renderAll();
        }
      });
    }

    /**
     * Insert Image Handler
     */
    function handleImageInsert(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const imgObj = new Image();
        imgObj.src = event.target.result;
        imgObj.onload = () => {
          const targetCanvasIndex = Math.max(0, Math.min(state.pageNum - 1, state.fabricCanvases.length - 1));
          const currentCanvas = state.fabricCanvases[targetCanvasIndex];
          if (!currentCanvas) return;

          const fabricImg = new fabric.Image(imgObj, {
            left: currentCanvas.baseWidth / 4,
            top: currentCanvas.baseHeight / 4,
            opacity: 1.0,
            imageSmoothing: true,
            objectCaching: false
          });

          // Compute size relative to logical base width to ensure consistent insertion regardless of zoom
          const targetWidth = currentCanvas.baseWidth * 0.4;
          fabricImg.scaleToWidth(targetWidth);

          currentCanvas.add(fabricImg);
          currentCanvas.setActiveObject(fabricImg);
          setActiveTool('view');
        };
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    }

    /**
     * Watermark Creator
     */
    function applyWatermark() {
      const text = document.getElementById('wm-text').value || 'CONFIDENTIAL';
      const color = document.getElementById('wm-color').value;
      const size = parseInt(document.getElementById('wm-size').value) || 48;
      const opacity = (parseInt(document.getElementById('wm-opacity').value) || 30) / 100;
      const angle = parseInt(document.getElementById('wm-angle').value) || -45;
      const target = document.getElementById('wm-target').value;

      const applyToCanvas = (fCanvas) => {
        const watermarkText = new fabric.Text(text, {
          fontSize: size,
          fill: color,
          opacity: opacity,
          angle: angle,
          originX: 'center',
          originY: 'center',
          left: fCanvas.baseWidth / 2,
          top: fCanvas.baseHeight / 2,
          selectable: true
        });
        fCanvas.add(watermarkText);
        fCanvas.renderAll();
      };

      if (target === 'all') {
        state.fabricCanvases.forEach(applyToCanvas);
      } else {
        const activeCanvas = state.fabricCanvases[state.pageNum - 1];
        if (activeCanvas) applyToCanvas(activeCanvas);
      }

      document.getElementById('watermark-modal').classList.add('hidden');
    }

    /**
     * Page Navigation & Zooming Controls
     */
    function changePage(delta) {
      const targetPage = state.pageNum + delta;
      if (targetPage >= 1 && targetPage <= state.pageCount) {
        state.pageNum = targetPage;
        pageNumInput.value = state.pageNum;
        scrollToPage(state.pageNum);
      }
    }

    function scrollToPage(num) {
      const targetEl = document.getElementById(`page-container-${num}`);
      if (targetEl) {
        targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    /**
     * Fluid Smooth Zoom - Instantaneous manipulation of CSS + Canvas Properties
     */
    function setZoom(newScale) {
      if (newScale < 0.5 || newScale > 4.0 || state.isRendering || state.fabricCanvases.length === 0) return;
      
      const oldScale = state.scale;
      state.scale = newScale;
      zoomVal.textContent = Math.round(state.scale * 100) + '%';
      
      const scaleRatio = state.scale / oldScale;

      // Maintain scroll position centered to zoom target
      const container = viewportContainer;
      const centerScrollY = container.scrollTop + container.clientHeight / 2;
      const centerScrollX = container.scrollLeft + container.clientWidth / 2;

      state.fabricCanvases.forEach((fCanvas, index) => {
        const pageNum = index + 1;
        const pageContainer = document.getElementById(`page-container-${pageNum}`);
        if (!pageContainer) return;

        // Calculate newly scaled physical dimensions
        const newWidth = fCanvas.baseWidth * state.scale;
        const newHeight = fCanvas.baseHeight * state.scale;

        // Scale Parent Container
        pageContainer.style.width = `${newWidth}px`;
        pageContainer.style.height = `${newHeight}px`;

        // Stretch PDF Background Canvas via CSS for fluid rendering
        const pdfCanvas = pageContainer.querySelector('.pdf-canvas-layer');
        if (pdfCanvas) {
          pdfCanvas.style.width = `${newWidth}px`;
          pdfCanvas.style.height = `${newHeight}px`;
        }

        // Scale overlay text-layer using CSS Transform
        const textLayer = pageContainer.querySelector('.text-layer');
        if (textLayer) {
          textLayer.style.transform = `scale(${state.scale})`;
        }

        // Adjust Fabric zoom & dimension states properly
        fCanvas.setDimensions({ width: newWidth, height: newHeight });
        fCanvas.setZoom(state.scale);
        fCanvas.calcOffset();
        fCanvas.renderAll();
      });

      // Adjust relative scroll position accurately
      container.scrollTop = centerScrollY * scaleRatio - container.clientHeight / 2;
      container.scrollLeft = centerScrollX * scaleRatio - container.clientWidth / 2;
    }

    /**
     * Undo & Redo System (Stores scale 1.0 JSON representation)
     */
    function saveHistoryState() {
      if (state.isApplyingHistory || state.isRendering) return;

      const snapshot = state.fabricCanvases.map(fc => fc.toJSON());
      state.history = state.history.slice(0, state.historyIndex + 1);
      state.history.push(snapshot);
      state.historyIndex = state.history.length - 1;

      updateUndoRedoUI();
    }

    function undo() {
      if (state.historyIndex > 0) {
        state.historyIndex--;
        applyHistorySnapshot(state.history[state.historyIndex]);
      }
    }

    function redo() {
      if (state.historyIndex < state.history.length - 1) {
        state.historyIndex++;
        applyHistorySnapshot(state.history[state.historyIndex]);
      }
    }

    function applyHistorySnapshot(snapshot) {
      if (!snapshot) return;
      state.isApplyingHistory = true;
      let loadedCount = 0;

      snapshot.forEach((jsonState, idx) => {
        const fc = state.fabricCanvases[idx];
        if (fc) {
          fc.loadFromJSON(jsonState, () => {
            fc.renderAll();
            loadedCount++;
            if (loadedCount === snapshot.length) {
              state.isApplyingHistory = false;
              updateUndoRedoUI();
            }
          });
        }
      });
    }

    function updateUndoRedoUI() {
      document.getElementById('btn-undo').disabled = state.historyIndex <= 0;
      document.getElementById('btn-redo').disabled = state.historyIndex >= state.history.length - 1;
    }

    function updateToolUI() {
      toolBtns.forEach(btn => {
        if (btn.getAttribute('data-tool') === state.activeTool) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    /**
     * Export & Save PDF with Layer Merging (Using PDF-Lib)
     */
    async function saveExportPDF() {
      if (!state.pdfBytes) return;

      const btnSave = document.getElementById('btn-save-pdf');
      const origContent = btnSave.innerHTML;
      btnSave.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Processing...`;
      btnSave.disabled = true;

      try {
        const pdfDoc = await PDFLib.PDFDocument.load(state.pdfBytes);
        const pages = pdfDoc.getPages();

        for (let i = 0; i < pages.length; i++) {
          const page = pages[i];
          const fCanvas = state.fabricCanvases[i];

          if (fCanvas && fCanvas.getObjects().length > 0) {
            
            // To ensure perfect mapping, revert scale to 1 temporarily to extract native size base coordinates overlay
            const originalZoom = fCanvas.getZoom();
            const originalWidth = fCanvas.width;
            const originalHeight = fCanvas.height;
            
            fCanvas.setZoom(1);
            fCanvas.setDimensions({ width: fCanvas.baseWidth, height: fCanvas.baseHeight });
            fCanvas.discardActiveObject();
            fCanvas.renderAll();

            const overlayDataUrl = fCanvas.toDataURL({ format: 'png', multiplier: 2 }); // x2 resolution quality multiplier
            const pngImage = await pdfDoc.embedPng(overlayDataUrl);

            // Re-apply original active viewport sizing
            fCanvas.setDimensions({ width: originalWidth, height: originalHeight });
            fCanvas.setZoom(originalZoom);
            fCanvas.renderAll();

            const { width, height } = page.getSize();
            page.drawImage(pngImage, {
              x: 0,
              y: 0,
              width: width,
              height: height
            });
          }
        }

        const modifiedPdfBytes = await pdfDoc.save();
        download(modifiedPdfBytes, "pagecraft_edited.pdf", "application/pdf");
      } catch (err) {
        console.error("Error generating exported PDF: ", err);
        alert("An error occurred while building the exported PDF. Check console for details.");
      } finally {
        btnSave.innerHTML = origContent;
        btnSave.disabled = false;
      }
    }
  </script>
