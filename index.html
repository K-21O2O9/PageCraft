<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PageCraft - Advanced PDF Studio</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts for Beautified Writing -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  
  <!-- Core Engines -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://unpkg.com/downloadjs@1.4.7/download.min.js"></script>
  
  <!-- Tesseract.js for Client-Side OCR (Beautify feature) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>

  <style>
    /* Premium Scrollbars */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; border: 2px solid #0f172a; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    body { overscroll-behavior-y: none; }

    /* UI Animations */
    .menu-transition { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    .menu-collapsed { transform: translateY(-100%); margin-bottom: -120px; opacity: 0; pointer-events: none; }
    
    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Tool Buttons */
    .tool-btn { transition: all 0.2s ease; }
    .tool-btn.active {
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      box-shadow: inset 0 0 0 1px rgba(99, 102, 241, 0.4);
    }

    /* Virtualized Canvas Container */
    #document-wrapper {
      transform-origin: top left;
      transition: transform 0.1s ease-out;
    }

    .pdf-page-container {
      position: relative;
      margin: 0 auto 2rem auto; 
      background: white;
      box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.6), 0 4px 10px -5px rgba(0, 0, 0, 0.4);
      border-radius: 4px;
    }

    .pdf-canvas-layer {
      position: absolute;
      top: 0; left: 0;
      z-index: 1;
      pointer-events: none;
    }

    .canvas-container {
      position: absolute !important;
      top: 0 !important; left: 0 !important;
      z-index: 2 !important;
    }

    .view-mode-active .canvas-container { pointer-events: none !important; }
    
    .text-layer {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      z-index: 3; pointer-events: none;
      opacity: 1; line-height: 1.0;
    }
    .text-layer.active-select { pointer-events: auto !important; user-select: text; }
    .text-layer span { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0% 0%; }
    .text-layer.active-select ::selection { background: rgba(99, 102, 241, 0.4); color: transparent; }

    #loading-indicator {
      transition: opacity 0.3s ease;
    }
  </style>
</head>

<body class="h-full flex flex-col font-sans overflow-hidden select-none bg-slate-950">

  <!-- Floating Toggle Menu Button -->
  <button id="btn-toggle-menu" class="absolute top-2 right-4 z-50 p-2 rounded-full bg-slate-800/80 hover:bg-slate-700 text-slate-300 backdrop-blur shadow-lg border border-slate-600/50 transition-all opacity-0 pointer-events-none translate-y-[-20px]">
    <i class="fa-solid fa-chevron-down text-sm"></i>
  </button>

  <!-- Header & Toolbar Container (Collapsible) -->
  <div id="ui-header-container" class="menu-transition z-40 shrink-0 relative">
    
    <!-- Top Navigation -->
    <header class="h-16 glass-panel flex items-center justify-between px-4">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-blue-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <i class="fa-solid fa-file-signature text-white text-xl"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-wide text-white">PageCraft</h1>
          <p class="text-xs text-indigo-300/80 font-medium tracking-wider uppercase">Studio</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <label for="pdf-upload" class="flex items-center space-x-2 px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold cursor-pointer transition border border-slate-700/50">
          <i class="fa-solid fa-folder-open text-indigo-400"></i>
          <span>Open</span>
          <input type="file" id="pdf-upload" accept="application/pdf" class="hidden">
        </label>

        <div class="h-5 w-px bg-slate-700 mx-1 hidden sm:block"></div>

        <button id="btn-undo" title="Undo (Ctrl+Z)" class="p-2 rounded-lg bg-slate-800/50 hover:bg-slate-700 text-slate-300 disabled:opacity-30 transition">
          <i class="fa-solid fa-rotate-left text-sm"></i>
        </button>
        <button id="btn-redo" title="Redo (Ctrl+Y)" class="p-2 rounded-lg bg-slate-800/50 hover:bg-slate-700 text-slate-300 disabled:opacity-30 transition">
          <i class="fa-solid fa-rotate-right text-sm"></i>
        </button>

        <div class="h-5 w-px bg-slate-700 mx-1 hidden sm:block"></div>

        <div class="flex items-center bg-slate-900/60 rounded-lg p-1 border border-slate-700/50">
          <button id="btn-zoom-out" class="p-1 rounded text-slate-400 hover:text-white hover:bg-slate-700 transition"><i class="fa-solid fa-minus text-[10px]"></i></button>
          <span id="zoom-percentage" class="px-2 text-xs font-mono font-bold text-indigo-300 w-[55px] text-center">100%</span>
          <button id="btn-zoom-in" class="p-1 rounded text-slate-400 hover:text-white hover:bg-slate-700 transition"><i class="fa-solid fa-plus text-[10px]"></i></button>
        </div>

        <div class="h-5 w-px bg-slate-700 mx-1 hidden sm:block"></div>

        <button id="btn-save-pdf" class="flex items-center space-x-2 px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shadow-lg shadow-indigo-600/20 transition relative overflow-hidden group">
          <i class="fa-solid fa-download"></i>
          <span>Export</span>
          <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform"></div>
        </button>
        
        <!-- Minimize Menu Button -->
        <button id="btn-minimize-menu" title="Hide Menu" class="ml-2 p-2 rounded-full bg-slate-800/50 hover:bg-slate-700 text-slate-400 hover:text-white transition">
          <i class="fa-solid fa-chevron-up text-sm"></i>
        </button>
      </div>
    </header>

    <!-- Secondary Toolbar -->
    <div class="glass-panel px-4 py-2.5 flex flex-wrap items-center justify-between gap-3 shadow-xl shadow-black/20">
      
      <!-- Tools -->
      <div class="flex items-center gap-1 bg-slate-900/50 p-1 rounded-xl border border-slate-700/50">
        <button data-tool="view" title="Pan & Zoom View" class="tool-btn active flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200">
          <i class="fa-solid fa-hand"></i><span class="hidden md:inline">View</span>
        </button>
        <button data-tool="select" title="Select & Move Objects" class="tool-btn flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200">
          <i class="fa-solid fa-arrow-pointer"></i><span class="hidden md:inline">Select</span>
        </button>
        <div class="w-px h-4 bg-slate-700 mx-1"></div>
        <button data-tool="text-select" title="Highlight Native PDF Text" class="tool-btn flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200">
          <i class="fa-solid fa-i-cursor"></i>
        </button>
        <button data-tool="textbox" title="Add Text" class="tool-btn flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200">
          <i class="fa-solid fa-font"></i>
        </button>
        <div class="w-px h-4 bg-slate-700 mx-1"></div>
        <button data-tool="pen" title="Draw" class="tool-btn flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200">
          <i class="fa-solid fa-pen-nib"></i>
        </button>
        <button data-tool="highlight" title="Highlighter" class="tool-btn flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200">
          <i class="fa-solid fa-highlighter"></i>
        </button>
        <button data-tool="eraser" title="Erase Objects" class="tool-btn flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200">
          <i class="fa-solid fa-eraser"></i>
        </button>
        
        <button id="btn-delete-selected" title="Delete Selected" class="px-2 py-1.5 rounded-lg text-xs font-medium text-rose-400 hover:bg-rose-500/20 transition hidden ml-1">
          <i class="fa-solid fa-trash-can"></i>
        </button>
      </div>

      <!-- Properties -->
      <div class="flex items-center gap-4 bg-slate-900/50 p-1.5 px-3 rounded-xl border border-slate-700/50 text-xs">
        <div class="flex items-center space-x-2">
          <div class="w-6 h-6 rounded-md overflow-hidden border border-slate-600 relative">
            <input type="color" id="prop-color" value="#ef4444" class="absolute -top-2 -left-2 w-10 h-10 cursor-pointer">
          </div>
        </div>
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-circle text-[8px] text-slate-500"></i>
          <input type="range" id="prop-size" min="1" max="60" value="4" class="w-20 accent-indigo-500">
        </div>
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-droplet text-[10px] text-slate-500"></i>
          <input type="range" id="prop-opacity" min="0.1" max="1.0" step="0.05" value="1.0" class="w-20 accent-indigo-500">
        </div>
      </div>

      <!-- Pagination -->
      <div class="flex items-center space-x-2 bg-slate-900/50 rounded-xl px-3 py-1 border border-slate-700/50">
        <button id="btn-prev-page" class="p-1 text-slate-400 hover:text-white disabled:opacity-30"><i class="fa-solid fa-chevron-left text-xs"></i></button>
        <input type="number" id="page-num-input" value="1" min="1" class="w-12 bg-slate-800/80 text-center font-bold text-indigo-300 border border-slate-600 rounded py-0.5 text-xs focus:outline-none focus:border-indigo-500">
        <span class="text-xs text-slate-400 font-medium">/ <span id="page-count">0</span></span>
        <button id="btn-next-page" class="p-1 text-slate-400 hover:text-white disabled:opacity-30"><i class="fa-solid fa-chevron-right text-xs"></i></button>
      </div>
    </div>
  </div>

  <!-- Loading State -->
  <div id="loading-indicator" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur flex flex-col items-center justify-center opacity-0 pointer-events-none">
    <i class="fa-solid fa-circle-notch fa-spin text-4xl text-indigo-500 mb-4"></i>
    <p id="loading-text" class="text-slate-300 font-medium tracking-wide">Processing Document...</p>
  </div>

  <!-- Main Viewport -->
  <main id="viewport-container" class="flex-1 relative overflow-auto bg-slate-950 p-6 flex flex-col view-mode-active">
    
    <!-- Empty State -->
    <div id="drop-zone" class="my-auto mx-auto flex flex-col items-center justify-center p-10 border-2 border-dashed border-slate-700/60 rounded-2xl bg-slate-900/40 hover:bg-slate-800/60 hover:border-indigo-500/50 transition-all cursor-pointer max-w-lg text-center shadow-2xl">
      <div class="w-16 h-16 rounded-full bg-indigo-500/10 text-indigo-400 flex items-center justify-center mb-4 text-3xl">
        <i class="fa-solid fa-cloud-arrow-up"></i>
      </div>
      <h3 class="text-lg font-bold text-white mb-2">Upload PDF Document</h3>
      <p class="text-sm text-slate-400 mb-6 leading-relaxed">Drag and drop your file here, or click to browse. Fully client-side, your privacy is guaranteed.</p>
      <button class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm shadow-lg shadow-indigo-600/20 transition-all pointer-events-none">
        Choose File
      </button>
    </div>

    <!-- The Virtualized Document Wrapper -->
    <div id="document-wrapper" class="hidden flex flex-col">
      <!-- Page Containers will be injected here dynamically by AppCore -->
    </div>

  </main>

  <script>
    /**
     * MODULE 1: AppCore & State
     */
    const AppState = {
      pdfDoc: null,
      pdfBytes: null,
      numPages: 0,
      pageDimensions: [], 
      
      scale: 1.0,         
      zoomCssScale: 1.0,  
      
      activeTool: 'view', 
      beautifyWriting: false,
      pendingStrokes: [],
      strokeTimeout: null,

      pageData: {},       
      activePages: new Set(), 
      fabricInstances: {}, 
      
      historyStack: [],
      historyIndex: -1,
      isApplyingHistory: false
    };

    /**
     * Tesseract Preload Engine (For zero-latency handwriting recognition)
     */
    const BeautifyEngine = {
      workerPromise: null,
      init() {
        this.workerPromise = (async () => {
          try {
            const worker = await Tesseract.createWorker('eng');
            // Hard whitelist strictly to text and numbers to prevent scribbles from becoming weird symbols
            await worker.setParameters({
              tessedit_char_whitelist: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 .,!?'
            });
            return worker;
          } catch (e) {
            console.error("Failed to init BeautifyEngine", e);
            return null;
          }
        })();
      }
    };

    /**
     * MODULE 13: Menu Controller
     */
    const MenuController = {
      init() {
        const header = document.getElementById('ui-header-container');
        const btnMin = document.getElementById('btn-minimize-menu');
        const btnToggle = document.getElementById('btn-toggle-menu');

        btnMin.addEventListener('click', () => {
          header.classList.add('menu-collapsed');
          btnToggle.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
        });

        btnToggle.addEventListener('click', () => {
          header.classList.remove('menu-collapsed');
          btnToggle.classList.add('opacity-0', 'pointer-events-none', 'translate-y-[-20px]');
        });
      },
      showLoading(text) {
        const ind = document.getElementById('loading-indicator');
        document.getElementById('loading-text').textContent = text;
        ind.classList.remove('opacity-0', 'pointer-events-none');
      },
      hideLoading() {
        document.getElementById('loading-indicator').classList.add('opacity-0', 'pointer-events-none');
      }
    };

    /**
     * MODULE 12: Undo/Redo System
     */
    const HistoryManager = {
      saveState() {
        if (AppState.isApplyingHistory) return;
        
        AppState.activePages.forEach(pageNum => {
          if (AppState.fabricInstances[pageNum]) {
            AppState.pageData[pageNum] = JSON.stringify(AppState.fabricInstances[pageNum].toJSON());
          }
        });

        const snapshot = JSON.stringify(AppState.pageData);
        
        AppState.historyStack = AppState.historyStack.slice(0, AppState.historyIndex + 1);
        AppState.historyStack.push(snapshot);
        if (AppState.historyStack.length > 20) AppState.historyStack.shift(); 
        else AppState.historyIndex++;
        
        this.updateUI();
      },
      async applyState(snapshotStr) {
        AppState.isApplyingHistory = true;
        try {
          AppState.pageData = JSON.parse(snapshotStr);
          
          for (let pageNum of AppState.activePages) {
            const fCanvas = AppState.fabricInstances[pageNum];
            if (fCanvas && AppState.pageData[pageNum]) {
              await new Promise(resolve => fCanvas.loadFromJSON(AppState.pageData[pageNum], resolve));
              fCanvas.setZoom(AppState.scale); // Hard enforce coordinates relative to zoom state!
              fCanvas.renderAll();
            } else if (fCanvas) {
              fCanvas.clear();
            }
          }
        } finally {
          AppState.isApplyingHistory = false;
          this.updateUI();
        }
      },
      undo() {
        if (AppState.historyIndex > 0) {
          AppState.historyIndex--;
          this.applyState(AppState.historyStack[AppState.historyIndex]);
        }
      },
      redo() {
        if (AppState.historyIndex < AppState.historyStack.length - 1) {
          AppState.historyIndex++;
          this.applyState(AppState.historyStack[AppState.historyIndex]);
        }
      },
      updateUI() {
        document.getElementById('btn-undo').disabled = AppState.historyIndex <= 0;
        document.getElementById('btn-redo').disabled = AppState.historyIndex >= AppState.historyStack.length - 1;
      }
    };

    /**
     * MODULE 10/11: Selection & Tool Controller
     */
    const ToolController = {
      init() {
        const btns = document.querySelectorAll('.tool-btn[data-tool]');
        btns.forEach(btn => {
          btn.addEventListener('click', () => {
            const tool = btn.getAttribute('data-tool');
            this.setActiveTool(tool);
          });
        });

        document.getElementById('prop-color').addEventListener('input', this.updateProps.bind(this));
        document.getElementById('prop-size').addEventListener('input', this.updateProps.bind(this));
        document.getElementById('prop-opacity').addEventListener('input', this.updateProps.bind(this));
        document.getElementById('btn-delete-selected').addEventListener('click', this.deleteSelected.bind(this));
        
        window.addEventListener('keydown', (e) => {
          if ((e.key === 'Delete' || e.key === 'Backspace') && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
            this.deleteSelected();
          }
        });
      },

      setActiveTool(tool) {
        AppState.activeTool = tool;
        
        document.querySelectorAll('.tool-btn[data-tool]').forEach(b => {
          b.classList.toggle('active', b.getAttribute('data-tool') === tool);
        });

        const viewport = document.getElementById('viewport-container');
        if (tool === 'view' || tool === 'text-select') {
          viewport.classList.add('view-mode-active');
        } else {
          viewport.classList.remove('view-mode-active');
        }

        document.querySelectorAll('.text-layer').forEach(layer => {
          layer.classList.toggle('active-select', tool === 'text-select');
        });

        AppState.activePages.forEach(pageNum => {
          this.applyToolToCanvas(AppState.fabricInstances[pageNum]);
        });
      },

      applyToolToCanvas(fCanvas) {
        if (!fCanvas) return;
        const tool = AppState.activeTool;
        const color = document.getElementById('prop-color').value;
        const size = parseInt(document.getElementById('prop-size').value);
        const opacity = parseFloat(document.getElementById('prop-opacity').value);

        fCanvas.isDrawingMode = (tool === 'pen' || tool === 'highlight');
        fCanvas.selection = (tool === 'select');
        
        if (fCanvas.isDrawingMode) {
          fCanvas.freeDrawingBrush = new fabric.PencilBrush(fCanvas);
          fCanvas.freeDrawingBrush.color = tool === 'highlight' ? this.hexToRgba(color, Math.min(opacity * 0.5, 0.5)) : color;
          fCanvas.freeDrawingBrush.width = tool === 'highlight' ? size * 3 : size;
          fCanvas.defaultCursor = 'crosshair';
        } else {
          fCanvas.defaultCursor = tool === 'view' ? 'grab' : (tool === 'eraser' ? 'cell' : 'default');
        }

        if (tool !== 'select' && tool !== 'textbox') {
            fCanvas.discardActiveObject();
        }

        fCanvas.forEachObject(obj => {
          if (tool === 'textbox' && (obj.type === 'textbox' || obj.type === 'i-text')) {
              obj.selectable = true;
              obj.evented = true;
          } else {
              obj.selectable = (tool === 'select');
              obj.evented = (tool === 'select' || tool === 'eraser');
          }
        });

        fCanvas.off('mouse:down');
        fCanvas.off('mouse:move');
        fCanvas.off('mouse:up');
        fCanvas.off('path:created'); 

        // Instant OCR Handwriting trigger
        fCanvas.on('path:created', (e) => {
          if (AppState.activeTool === 'pen' && AppState.beautifyWriting) {
            AppState.pendingStrokes.push(e.path);
            clearTimeout(AppState.strokeTimeout);
            
            AppState.strokeTimeout = setTimeout(() => {
              this.processBeautify(fCanvas);
            }, 800); // Trigger super-fast snapshot 800ms after user pauses pen
          }
        });

        if (tool === 'textbox') {
          fCanvas.on('mouse:down', (o) => {
            if (o.target && (o.target.type === 'textbox' || o.target.type === 'i-text')) return;
            
            const pointer = fCanvas.getPointer(o.e); // Retrieves precise unzoomed coordinates
            const textbox = new fabric.Textbox('Type here', {
              left: pointer.x, top: pointer.y,
              width: Math.max(150, size * 5), 
              fontSize: Math.max(16, size * 2),
              fill: color, opacity: opacity,
              fontFamily: 'sans-serif', editable: true,
              cursorColor: color
            });
            fCanvas.add(textbox);
            fCanvas.setActiveObject(textbox);
            textbox.enterEditing();
            textbox.selectAll();
            fCanvas.renderAll();
          });
        } 
        else if (tool === 'eraser') {
          let isErasing = false;
          fCanvas.on('mouse:down', (o) => { isErasing = true; if(o.target) { fCanvas.remove(o.target); HistoryManager.saveState(); } });
          fCanvas.on('mouse:move', (o) => { if(isErasing && o.target) { fCanvas.remove(o.target); } });
          fCanvas.on('mouse:up', () => { if(isErasing) HistoryManager.saveState(); isErasing = false; });
        }

        fCanvas.renderAll();
      },
      
      /**
       * Core Auto OCR engine (Instant, Client-Side)
       */
      async processBeautify(fCanvas) {
        if (AppState.pendingStrokes.length === 0) return;
        const strokes = [...AppState.pendingStrokes];
        AppState.pendingStrokes = [];

        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        strokes.forEach(p => {
          const rect = p.getBoundingRect();
          minX = Math.min(minX, rect.left);
          minY = Math.min(minY, rect.top);
          maxX = Math.max(maxX, rect.left + rect.width);
          maxY = Math.max(maxY, rect.top + rect.height);
        });

        const pad = 40; 
        minX -= pad; minY -= pad; maxX += pad; maxY += pad;
        const w = maxX - minX;
        const h = maxY - minY;

        if (w <= pad * 2 + 5 || h <= pad * 2 + 5) return;

        // Isolate strokes on a high-DPI temporary canvas, applying contrast thresholds
        const tempCanvasEl = document.createElement('canvas');
        const tempFCanvas = new fabric.StaticCanvas(tempCanvasEl, {
          width: w * 3, height: h * 3, backgroundColor: 'white' // 3x scaling for sharp OCR
        });
        tempFCanvas.setZoom(3);

        strokes.forEach(p => {
          p.clone((cloned) => {
            cloned.set({
              left: cloned.left - minX,
              top: cloned.top - minY,
              stroke: 'black',
              strokeWidth: Math.max(6, cloned.strokeWidth * 1.5) // Super thick black lines for accurate reading
            });
            tempFCanvas.add(cloned);
          });
        });
        tempFCanvas.renderAll();

        const dataUrl = tempCanvasEl.toDataURL('image/png');
        
        try {
          const worker = await BeautifyEngine.workerPromise;
          if (!worker) return;

          const result = await worker.recognize(dataUrl);
          let text = result.data.text.trim();
          text = text.replace(/^[^\w\s]+|[^\w\s]+$/g, '');

          if (text.length > 0) {
            AppState.isApplyingHistory = true; 
            
            strokes.forEach(p => fCanvas.remove(p));

            const color = document.getElementById('prop-color').value;
            const opacity = parseFloat(document.getElementById('prop-opacity').value);
            
            // Generate clean Dancing Script text on the exact base coordinates
            const textbox = new fabric.Textbox(text, {
              left: minX + pad,
              top: minY + pad,
              width: Math.max(150, w - pad * 2),
              fontSize: Math.max(24, h * 0.7),
              fill: color,
              opacity: opacity,
              fontFamily: "'Dancing Script', cursive",
              fontWeight: "bold",
              editable: true
            });
            
            fCanvas.add(textbox);
            fCanvas.renderAll();
            
            AppState.isApplyingHistory = false;
            HistoryManager.saveState();
          }
        } catch(e) {
          console.error("OCR Error", e);
        }
      },

      updateProps() {
        const color = document.getElementById('prop-color').value;
        const size = parseInt(document.getElementById('prop-size').value);
        const opacity = parseFloat(document.getElementById('prop-opacity').value);
        
        AppState.activePages.forEach(pageNum => {
          const fc = AppState.fabricInstances[pageNum];
          if (!fc) return;
          
          if (fc.isDrawingMode) {
             fc.freeDrawingBrush.color = AppState.activeTool === 'highlight' ? this.hexToRgba(color, Math.min(opacity * 0.5, 0.5)) : color;
             fc.freeDrawingBrush.width = AppState.activeTool === 'highlight' ? size * 3 : size;
          }
          const obj = fc.getActiveObject();
          if (obj) {
            if (obj.type === 'textbox') obj.set({ fill: color, opacity, fontSize: Math.max(16, size*2) });
            else if (obj.type === 'path') obj.set({ stroke: color, strokeWidth: size, opacity });
            else obj.set({ opacity });
            fc.renderAll();
            HistoryManager.saveState();
          }
        });
      },

      deleteSelected() {
        AppState.activePages.forEach(pageNum => {
          const fc = AppState.fabricInstances[pageNum];
          if (fc) {
            const active = fc.getActiveObjects();
            if (active.length) {
              active.forEach(obj => fc.remove(obj));
              fc.discardActiveObject();
              HistoryManager.saveState();
            }
          }
        });
        document.getElementById('btn-delete-selected').classList.add('hidden');
      },

      hexToRgba(hex, alpha) {
        const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
        return `rgba(${r},${g},${b},${alpha})`;
      }
    };

    /**
     * MODULE 3 & 15: Memory Manager & Page Cache
     */
    const MemoryManager = {
      observer: null,
      
      init() {
        this.observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            const pageNum = parseInt(entry.target.dataset.page);
            if (entry.isIntersecting) {
              this.loadPage(pageNum);
            } else {
              this.unloadPage(pageNum);
            }
          });
        }, { 
          root: document.getElementById('viewport-container'),
          rootMargin: "100% 0px"
        });
      },

      observePage(element) {
        this.observer.observe(element);
      },

      async loadPage(pageNum) {
        if (AppState.activePages.has(pageNum)) return;
        AppState.activePages.add(pageNum);
        
        const container = document.getElementById(`page-${pageNum}`);
        if (!container) return;

        if (!container.querySelector('.pdf-canvas-layer')) {
          container.innerHTML = `
            <canvas class="pdf-canvas-layer w-full h-full"></canvas>
            <canvas id="fabric-${pageNum}" class="w-full h-full"></canvas>
            <div class="text-layer text-layer-${pageNum}"></div>
          `;
        }

        await RenderEngine.renderPDFPage(pageNum, container);
        this.initFabricCanvas(pageNum, container);
      },

      unloadPage(pageNum) {
        if (!AppState.activePages.has(pageNum)) return;
        AppState.activePages.delete(pageNum);

        const container = document.getElementById(`page-${pageNum}`);
        if (!container) return;

        const fCanvas = AppState.fabricInstances[pageNum];
        if (fCanvas) {
          AppState.pageData[pageNum] = JSON.stringify(fCanvas.toJSON());
          fCanvas.dispose();
          delete AppState.fabricInstances[pageNum];
        }

        const pdfCanvas = container.querySelector('.pdf-canvas-layer');
        if (pdfCanvas) {
          pdfCanvas.width = 0; pdfCanvas.height = 0; 
        }
        
        const textLayer = container.querySelector('.text-layer');
        if(textLayer) textLayer.innerHTML = '';
      },

      initFabricCanvas(pageNum, container) {
        const canvasEl = container.querySelector(`#fabric-${pageNum}`);
        const dim = AppState.pageDimensions[pageNum];
        
        const fCanvas = new fabric.Canvas(canvasEl, {
          width: dim.width * AppState.scale,
          height: dim.height * AppState.scale,
          selection: false
        });
        
        fCanvas.baseWidth = dim.width;
        fCanvas.baseHeight = dim.height;
        
        // **CRITICAL FIX**: Locks logical coordinates globally to prevent shifting on viewport changes
        fCanvas.setZoom(AppState.scale);
        
        AppState.fabricInstances[pageNum] = fCanvas;

        fCanvas.on('selection:created', () => document.getElementById('btn-delete-selected').classList.remove('hidden'));
        fCanvas.on('selection:cleared', () => document.getElementById('btn-delete-selected').classList.add('hidden'));
        
        fCanvas.on('object:added', () => { if (!AppState.isApplyingHistory && !fCanvas.isRendering) HistoryManager.saveState(); });
        
        fCanvas.on('mouse:down', () => {
            document.querySelectorAll('.pdf-page-container').forEach(el => el.style.zIndex = '1');
            container.style.zIndex = '10';
        });

        // GHOST OVERLAY LOGIC (Prevents clipping/going under other pages during drag)
        fCanvas.on('object:moving', (e) => {
            const obj = e.target;
            if (!obj) return;
            
            let dragProxy = document.getElementById('drag-proxy-overlay');
            if (!dragProxy) {
                dragProxy = document.createElement('div');
                dragProxy.id = 'drag-proxy-overlay';
                dragProxy.style.position = 'fixed';
                dragProxy.style.pointerEvents = 'none'; // Ensure elementsFromPoint works behind it!
                dragProxy.style.zIndex = '999999';
                dragProxy.style.display = 'none';
                document.body.appendChild(dragProxy);
            }
            
            // Generate snapshot of moving object if it hasn't been generated yet
            if (dragProxy.style.display === 'none') {
                obj.originalOpacity = obj.opacity;
                try {
                    const dataUrl = obj.toDataURL({ multiplier: AppState.scale });
                    dragProxy.style.backgroundImage = `url(${dataUrl})`;
                    dragProxy.style.backgroundSize = '100% 100%';
                    dragProxy.style.display = 'block';
                    // Hide original object on bounded canvas so it looks like it popped out
                    obj.set('opacity', 0); 
                } catch (err) {
                    // Fail gracefully in case of Cross-Origin security errors on toDataURL
                    console.warn("Drag proxy rendering failed", err);
                }
            }
            
            if (dragProxy.style.display === 'block') {
                const canvasRect = fCanvas.getElement().getBoundingClientRect();
                const objRect = obj.getBoundingRect();
                
                // Track proxy with the mouse visually based on viewport boundaries
                dragProxy.style.left = (canvasRect.left + objRect.left) + 'px';
                dragProxy.style.top = (canvasRect.top + objRect.top) + 'px';
                dragProxy.style.width = objRect.width + 'px';
                dragProxy.style.height = objRect.height + 'px';
            }
        });

        fCanvas.on('mouse:up', (e) => {
            const dragProxy = document.getElementById('drag-proxy-overlay');
            if (dragProxy) dragProxy.style.display = 'none';
            
            // Restore hidden object before `object:modified` fully triggers
            if (e.target && e.target.originalOpacity !== undefined) {
                e.target.set('opacity', e.target.originalOpacity);
                delete e.target.originalOpacity;
                fCanvas.renderAll();
            }
        });

        fCanvas.on('object:modified', (e) => {
            const obj = e.target;
            if (!obj) {
                if (!AppState.isApplyingHistory && !fCanvas.isRendering) HistoryManager.saveState();
                return;
            }

            const objRect = obj.getBoundingRect();
            const canvasRect = fCanvas.getElement().getBoundingClientRect();
            
            const absoluteCenterX = canvasRect.left + objRect.left + (objRect.width / 2);
            const absoluteCenterY = canvasRect.top + objRect.top + (objRect.height / 2);

            const elements = document.elementsFromPoint(absoluteCenterX, absoluteCenterY);
            const targetPageEl = elements ? elements.find(el => el.classList.contains('pdf-page-container')) : null;

            if (targetPageEl) {
                const targetPageNum = parseInt(targetPageEl.dataset.page);
                if (targetPageNum !== pageNum && AppState.fabricInstances[targetPageNum]) {
                    const targetCanvas = AppState.fabricInstances[targetPageNum];
                    const targetRect = targetCanvas.getElement().getBoundingClientRect();
                    
                    const dx = (canvasRect.left - targetRect.left) / AppState.scale;
                    const dy = (canvasRect.top - targetRect.top) / AppState.scale;
                    
                    obj.clone((cloned) => {
                        AppState.isApplyingHistory = true;

                        cloned.set({
                            left: obj.left + dx,
                            top: obj.top + dy
                        });
                        cloned.setCoords();
                        
                        fCanvas.remove(obj);
                        fCanvas.discardActiveObject();
                        
                        targetCanvas.add(cloned);
                        targetCanvas.setActiveObject(cloned);
                        
                        fCanvas.renderAll();
                        targetCanvas.renderAll();
                        
                        AppState.isApplyingHistory = false;
                        HistoryManager.saveState(); 
                    });
                    
                    return; 
                }
            }

            if (!AppState.isApplyingHistory && !fCanvas.isRendering) HistoryManager.saveState();
        });
        
        if (AppState.pageData[pageNum]) {
          fCanvas.isRendering = true;
          fCanvas.loadFromJSON(AppState.pageData[pageNum], () => {
            fCanvas.isRendering = false;
            fCanvas.setZoom(AppState.scale); // Hard reset scale constraint on cache load
            fCanvas.renderAll();
          });
        }

        ToolController.applyToolToCanvas(fCanvas);
      }
    };

    /**
     * MODULE 4: Rendering Engine & PDF Loader
     */
    const RenderEngine = {
      async loadDocument(file) {
        MenuController.showLoading("Loading PDF...");
        try {
          const arrayBuffer = await file.arrayBuffer();
          AppState.pdfBytes = arrayBuffer.slice(0); 
          
          const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
          AppState.pdfDoc = await loadingTask.promise;
          AppState.numPages = AppState.pdfDoc.numPages;
          
          document.getElementById('page-count').textContent = AppState.numPages;
          document.getElementById('drop-zone').classList.add('hidden');
          
          const wrapper = document.getElementById('document-wrapper');
          wrapper.innerHTML = '';
          wrapper.classList.remove('hidden');

          AppState.pageDimensions = [];
          AppState.pageData = {};
          AppState.activePages.clear();
          
          for (let i = 1; i <= AppState.numPages; i++) {
            const page = await AppState.pdfDoc.getPage(i);
            const vp = page.getViewport({ scale: 1.0 });
            AppState.pageDimensions[i] = { width: vp.width, height: vp.height };
            
            const div = document.createElement('div');
            div.className = 'pdf-page-container';
            div.id = `page-${i}`;
            div.dataset.page = i;
            div.style.width = `${vp.width * AppState.scale}px`;
            div.style.height = `${vp.height * AppState.scale}px`;
            wrapper.appendChild(div);
            
            MemoryManager.observePage(div);
          }

          HistoryManager.saveState();
        } catch (e) {
          console.error(e);
          alert("Failed to load PDF.");
        } finally {
          MenuController.hideLoading();
        }
      },

      async renderPDFPage(pageNum, container) {
        const page = await AppState.pdfDoc.getPage(pageNum);
        const viewport = page.getViewport({ scale: AppState.scale });
        
        const canvas = container.querySelector('.pdf-canvas-layer');
        const textLayer = container.querySelector('.text-layer');
        
        const dpr = window.devicePixelRatio || 1;
        canvas.width = viewport.width * dpr;
        canvas.height = viewport.height * dpr;
        const ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);

        const renderContext = { canvasContext: ctx, viewport: viewport };
        await page.render(renderContext).promise;

        const textContent = await page.getTextContent();
        textLayer.style.transform = `scale(${AppState.scale})`;
        await pdfjsLib.renderTextLayer({
          textContentSource: textContent,
          container: textLayer,
          viewport: page.getViewport({ scale: 1.0 }),
          textDivs: []
        }).promise;
      }
    };

    /**
     * MODULE 5: Viewport & Zoom Engine
     */
    const ViewportEngine = {
      zoomTimeout: null,
      
      init() {
        const vp = document.getElementById('viewport-container');
        
        vp.addEventListener('scroll', () => {
          const center = vp.scrollTop + vp.clientHeight / 2;
          for (let i of AppState.activePages) {
            const el = document.getElementById(`page-${i}`);
            if (el) {
              const rect = el.getBoundingClientRect();
              const elCenter = el.offsetTop - vp.scrollTop + el.clientHeight/2;
              if (Math.abs(elCenter - vp.clientHeight/2) < el.clientHeight/2) {
                document.getElementById('page-num-input').value = i;
                break;
              }
            }
          }
        });

        document.getElementById('btn-zoom-in').addEventListener('click', () => this.applyZoom(AppState.scale + 0.2));
        document.getElementById('btn-zoom-out').addEventListener('click', () => this.applyZoom(AppState.scale - 0.2));

        vp.addEventListener('wheel', (e) => {
          if (e.ctrlKey || e.metaKey) {
            e.preventDefault();
            const delta = e.deltaY < 0 ? 0.1 : -0.1;
            this.handleSmoothZoom(delta);
          }
        }, { passive: false });
      },

      handleSmoothZoom(delta) {
        if (AppState.numPages === 0) return;
        
        const targetScale = Math.min(Math.max(0.5, AppState.scale * AppState.zoomCssScale + delta), 4.0);
        AppState.zoomCssScale = targetScale / AppState.scale;
        
        document.getElementById('zoom-percentage').textContent = Math.round(targetScale * 100) + '%';
        document.getElementById('document-wrapper').style.transform = `scale(${AppState.zoomCssScale})`;

        clearTimeout(this.zoomTimeout);
        this.zoomTimeout = setTimeout(() => {
          this.commitZoom(targetScale);
        }, 300);
      },

      applyZoom(newScale) {
        if (AppState.numPages === 0) return;
        newScale = Math.min(Math.max(0.5, newScale), 4.0);
        document.getElementById('zoom-percentage').textContent = Math.round(newScale * 100) + '%';
        this.commitZoom(newScale);
      },

      async commitZoom(newScale) {
        const oldScale = AppState.scale;
        AppState.scale = newScale;
        AppState.zoomCssScale = 1.0;
        
        const wrapper = document.getElementById('document-wrapper');
        wrapper.style.transform = 'none';

        const vp = document.getElementById('viewport-container');
        const scrollRatio = newScale / oldScale;
        vp.scrollTop = vp.scrollTop * scrollRatio;
        vp.scrollLeft = vp.scrollLeft * scrollRatio;

        for (let i = 1; i <= AppState.numPages; i++) {
          const dim = AppState.pageDimensions[i];
          const el = document.getElementById(`page-${i}`);
          if (el) {
            el.style.width = `${dim.width * AppState.scale}px`;
            el.style.height = `${dim.height * AppState.scale}px`;
          }
        }

        for (let pageNum of AppState.activePages) {
          const container = document.getElementById(`page-${pageNum}`);
          await RenderEngine.renderPDFPage(pageNum, container);
          
          const fCanvas = AppState.fabricInstances[pageNum];
          if (fCanvas) {
            fCanvas.setDimensions({ 
              width: fCanvas.baseWidth * AppState.scale, 
              height: fCanvas.baseHeight * AppState.scale 
            });
            fCanvas.setZoom(AppState.scale);
            fCanvas.renderAll();
          }
        }
      },
      
      scrollToPage(num) {
        const el = document.getElementById(`page-${num}`);
        if(el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    };

    /**
     * MODULE 14: Export Engine
     */
    const ExportEngine = {
      async exportPDF() {
        if (!AppState.pdfBytes) return;
        MenuController.showLoading("Generating High-Quality PDF...");
        
        try {
          AppState.activePages.forEach(pageNum => {
             if (AppState.fabricInstances[pageNum]) {
                AppState.pageData[pageNum] = JSON.stringify(AppState.fabricInstances[pageNum].toJSON());
             }
          });

          const pdfDoc = await PDFLib.PDFDocument.load(AppState.pdfBytes);
          const pages = pdfDoc.getPages();

          for (let i = 0; i < pages.length; i++) {
            const pageNum = i + 1;
            const stateStr = AppState.pageData[pageNum];
            
            if (stateStr) {
              const stateObj = JSON.parse(stateStr);
              if (stateObj.objects && stateObj.objects.length > 0) {
                
                const dim = AppState.pageDimensions[pageNum];
                const exportScale = 3; 
                
                const tempCanvasEl = document.createElement('canvas');
                tempCanvasEl.width = dim.width * exportScale;
                tempCanvasEl.height = dim.height * exportScale;
                
                const exportCanvas = new fabric.StaticCanvas(tempCanvasEl, {
                  width: dim.width * exportScale,
                  height: dim.height * exportScale
                });

                await new Promise(resolve => exportCanvas.loadFromJSON(stateObj, resolve));
                
                exportCanvas.setZoom(exportScale);
                exportCanvas.renderAll();

                const pngDataUrl = exportCanvas.toDataURL({ format: 'png' });
                const pngImage = await pdfDoc.embedPng(pngDataUrl);

                const { width, height } = pages[i].getSize();
                pages[i].drawImage(pngImage, {
                  x: 0, y: 0,
                  width: width, height: height
                });
                
                exportCanvas.dispose();
              }
            }
          }

          const modifiedBytes = await pdfDoc.save();
          download(modifiedBytes, "PageCraft_Edited.pdf", "application/pdf");
          
        } catch (e) {
          console.error("Export Error:", e);
          alert("Failed to export PDF.");
        } finally {
          MenuController.hideLoading();
        }
      }
    };

    /**
     * Application Initialization
     */
    document.addEventListener('DOMContentLoaded', () => {
      BeautifyEngine.init(); // Preload instantly
      MenuController.init();
      ToolController.init();
      MemoryManager.init();
      ViewportEngine.init();

      document.getElementById('pdf-upload').addEventListener('change', e => {
        if (e.target.files[0]) RenderEngine.loadDocument(e.target.files[0]);
      });
      document.getElementById('btn-save-pdf').addEventListener('click', () => ExportEngine.exportPDF());
      
      document.getElementById('btn-undo').addEventListener('click', () => HistoryManager.undo());
      document.getElementById('btn-redo').addEventListener('click', () => HistoryManager.redo());

      document.getElementById('btn-prev-page').addEventListener('click', () => {
         const current = parseInt(document.getElementById('page-num-input').value);
         if(current > 1) ViewportEngine.scrollToPage(current - 1);
      });
      document.getElementById('btn-next-page').addEventListener('click', () => {
         const current = parseInt(document.getElementById('page-num-input').value);
         if(current < AppState.numPages) ViewportEngine.scrollToPage(current + 1);
      });
      document.getElementById('page-num-input').addEventListener('change', (e) => {
         let val = parseInt(e.target.value);
         if(val >= 1 && val <= AppState.numPages) ViewportEngine.scrollToPage(val);
      });

      const dropZone = document.getElementById('drop-zone');
      ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(ev => {
        dropZone.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); });
      });
      dropZone.addEventListener('drop', e => {
        if (e.dataTransfer.files[0]?.type === 'application/pdf') {
          RenderEngine.loadDocument(e.dataTransfer.files[0]);
        }
      });
      dropZone.addEventListener('click', () => document.getElementById('pdf-upload').click());
    });

  </script>
